services:
  postgres:
    image: postgres:16
    container_name: gulbahar-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gulbahar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulbahar}
      POSTGRES_DB: ${POSTGRES_DB:-gulbahar}
    volumes:
      - gulbahar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gulbahar} -d ${POSTGRES_DB:-gulbahar}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gulbahar-pgdata:
